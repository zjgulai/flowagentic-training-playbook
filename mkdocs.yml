site_name: FlowAgentic 培训与操作 Playbook
site_description: 面向使用者、流程搭建者、开发者和管理员的 FlowAgentic 中文培训说明书
site_author: FlowAgentic Playbook contributors
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-、。，；！？：""''（）【】《》]+'
  - macros:
      on_undefined: strict
  - minify:
      minify_html: true
  - redirects
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 92vw
      height: 92vh

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/print.css

extra:
  generator: false
  baseline:
    product_version: "3.1.3"
    release_sha: "6a5bb28b4590da42c7f1a42c515a8d2d5ba8cd64"
    screenshot_gate: "等待同版本隔离培训环境与正式截图回执"
  version:
    # Draft/PR builds are served from the site root and have no mike
    # versions.json. Enable the switcher only inside the release workflow,
    # where mike creates and validates the version index.
    provider: !ENV [PLAYBOOK_VERSION_PROVIDER, null]
    default: latest
    alias: true

copyright: >-
  正文采用 CC BY-NC-SA 4.0；示例代码采用 MIT。
  第三方商标、界面与资料按其原许可使用。

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

